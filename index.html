<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 工作台｜100% 本機處理的線上 PDF 工具</title>
<meta name="description" content="合併、拆分、排列、旋轉、裁剪、壓縮、浮水印、頁碼、簽名、編輯、密文、比較、表單填寫。所有處理都在瀏覽器完成，檔案不會上傳。">
<meta name="theme-color" content="#e5484d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PDF 工作台">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e5484d'/%3E%3Cpath d='M11 7h7l5 5v13H11z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://unpkg.com">
<style>
:root{
  --bg:#f2f3f5; --surface:#fff; --surface2:#f7f8fa; --ink:#141820; --muted:#677084; --line:#e2e5eb; --line2:#d3d8e0;
  --accent:#e5484d; --accent-h:#d43a3f; --accent-soft:#fdecec; --sel:#2563eb; --sel-soft:rgba(37,99,235,.12);
  --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  --r:12px; --r-s:8px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.07);
  --shadow-l:0 12px 40px rgba(16,24,40,.22);
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --thumb-w:168px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1014;--surface:#171a20;--surface2:#1d2128;--ink:#e9ebf0;--muted:#9aa3b5;--line:#2a2f38;--line2:#363c47;
  --accent-soft:#3b1c1e;--sel:#4f8cff;--sel-soft:rgba(79,140,255,.2);--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top);min-height:56px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.logo svg{width:18px;height:18px}
.privacy{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);padding:3px 9px;border-radius:99px}
.privacy svg{width:14px;height:14px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--surface);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s;user-select:none;-webkit-user-select:none}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.icon{padding:0;width:38px}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.icon.sm{width:32px}
.btn.block{width:100%}
.btn.danger{color:var(--err)}
.btn.on{background:var(--sel-soft);border-color:var(--sel);color:var(--sel)}

/* ---------- app layout ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) 340px}
.toolnav{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 20px}
.toolnav h6{margin:14px 10px 4px;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.toolnav h6:first-child{margin-top:2px}
.tbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:var(--r-s);text-align:left;color:var(--ink)}
.tbtn:hover{background:var(--surface2)}
.tbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

.workspace{position:relative;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ws-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ws-bar .info{font-size:13px;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.ws-bar .info b{color:var(--ink)}
.ws-bar .sp{flex:1}
.ws-bar input[type=range]{width:90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb-w),1fr));gap:18px;padding:18px 18px 120px;align-items:end}

.card{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.thumb{position:relative;width:100%;background:#fff;border-radius:6px;box-shadow:var(--shadow);overflow:hidden;outline:2px solid transparent;outline-offset:3px;transition:outline-color .12s,transform .12s}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.thumb svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:#b6bcc8;font-size:12px}
.card.sel .thumb{outline-color:var(--sel)}
.card .check{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(20,24,32,.28);display:grid;place-items:center;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);opacity:0;transition:opacity .12s}
.card:hover .check,.card.sel .check,body.touch .card .check{opacity:1}
.card.sel .check{background:var(--sel);border-color:var(--sel)}
.card .check svg{width:14px;height:14px;stroke-width:3;opacity:0}
.card.sel .check svg{opacity:1}
.cap{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted);min-height:20px}
.cap .num{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cap .dot{width:8px;height:8px;border-radius:50%;flex:none}
.cap .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.cap .bd{display:flex;gap:3px}
.cap .bd span{font-size:10px;padding:0 5px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);line-height:16px}
.card-acts{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .12s}
.card:hover .card-acts,body.touch .card-acts{opacity:1}
.card-acts button{width:30px;height:30px;border-radius:8px;border:0;display:grid;place-items:center;background:rgba(20,24,32,.72);color:#fff;backdrop-filter:blur(4px)}
.card-acts button:hover{background:rgba(20,24,32,.9)}
.card-acts svg{width:16px;height:16px}
body.touch .card-acts button{width:32px;height:32px}
.card.dragging{opacity:.3}
.drop-ind{position:fixed;width:4px;border-radius:4px;background:var(--sel);pointer-events:none;z-index:50;box-shadow:0 0 0 3px var(--sel-soft)}
.drag-ghost{position:fixed;z-index:60;pointer-events:none;width:90px;border-radius:6px;box-shadow:var(--shadow-l);transform:rotate(-4deg);background:#fff}
.drag-ghost img{width:100%;display:block;border-radius:6px}
.drag-ghost b{position:absolute;top:-8px;right:-8px;background:var(--sel);color:#fff;border-radius:99px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}

.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;overflow:auto}
.dropzone{max-width:680px;width:100%;text-align:center;padding:44px 28px;border:2px dashed var(--line2);border-radius:20px;background:var(--surface)}
.dropzone h2{margin:14px 0 6px;font-size:22px}
.dropzone p{margin:0 0 20px;color:var(--muted)}
.dz-icon{width:64px;height:64px;margin:auto;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.dz-icon svg{width:32px;height:32px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
.chips button{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.chips button:hover{color:var(--ink);border-color:var(--line2)}
.dragover-veil{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--sel) 14%,transparent);border:3px dashed var(--sel);display:none;place-items:center;font-size:22px;font-weight:700;color:var(--sel);pointer-events:none}
body.dragover .dragover-veil{display:grid}

/* ---------- panel ---------- */
.panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;overscroll-behavior:contain}
.ph-head{padding:18px 18px 6px}
.ph-row{display:flex;align-items:center;gap:8px}
.ph-head h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.ph-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.sec{padding:12px 18px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec h4{margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row+.row{margin-top:8px}
.row>.btn{flex:1 1 auto}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld:last-child{margin-bottom:0}
.fld>span{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.fld output{color:var(--ink);font-variant-numeric:tabular-nums}
.inp{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--surface)}
textarea.inp{resize:vertical;min-height:70px}
.inp:focus{outline:2px solid var(--sel-soft);border-color:var(--sel)}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px;margin:0}
.chk{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-s);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 8px;font-size:13px;color:var(--muted);min-height:32px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:132px}
.grid9 button{height:30px;border:1px solid var(--line2);background:var(--surface);border-radius:6px;display:grid;place-items:center}
.grid9 button::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--line2)}
.grid9 button.on{border-color:var(--accent)}
.grid9 button.on::after{background:var(--accent)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;line-height:1.6}
.note.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.note.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.note b{color:var(--ink)}
.preview-box{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-s);display:grid;place-items:center;padding:10px;min-height:160px}
.preview-box canvas{max-width:100%;max-height:300px;box-shadow:var(--shadow);background:#fff}
.srclist{display:flex;flex-direction:column;gap:6px}
.srcitem{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-s);font-size:13px}
.srcitem .dot{width:10px;height:10px;border-radius:50%;flex:none}
.srcitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcitem small{color:var(--muted);white-space:nowrap}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-s);padding:10px;text-align:left}
.preset b{display:block;font-size:14px}
.preset small{color:var(--muted);font-size:12px}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.result{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;background:var(--surface2)}
.result .big{font-size:22px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.siglist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sig{position:relative;border:1px solid var(--line2);border-radius:var(--r-s);height:70px;background:#fff center/contain no-repeat;background-origin:content-box;padding:8px}
.sig.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sig .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:6px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1}
.fieldlist{display:flex;flex-direction:column;gap:12px}
.fieldlist .fld>span small{color:var(--muted)}
.kbd{font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
ul.tips{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
ul.tips li{margin:3px 0}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.overlay[hidden]{display:none}
.ov-top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.ov-top .ttl{font-weight:700;margin-right:6px}
.ov-top .sp{flex:1}
.pgnav{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.pgnav span{min-width:70px;text-align:center;font-size:13px}
.ed-tools{display:flex;gap:4px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.ed-tools::-webkit-scrollbar{display:none}
.etb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 6px 4px;border:1px solid transparent;border-radius:var(--r-s);background:transparent;font-size:11.5px;color:var(--muted)}
.etb:hover{background:var(--surface2)}
.etb.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.etb svg.i{width:22px;height:22px}
.ed-props{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 12px;background:var(--surface2);border-bottom:1px solid var(--line);min-height:50px;font-size:13px;flex:none}
.ed-props .lbl{color:var(--muted)}
.ed-props input[type=range]{width:110px}
.ed-props .hint{color:var(--muted)}
.ed-props .grp{display:flex;gap:6px;align-items:center}
.ed-props .vsep{width:1px;height:24px;background:var(--line2)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line2);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.ed-stage{flex:1;overflow:auto;position:relative;background:var(--bg);-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.ed-pagewrap{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;width:max-content;margin:auto}
.ed-page{position:relative;background:#fff;box-shadow:var(--shadow-l);flex:none}
.ed-page canvas{position:absolute;inset:0;width:100%;height:100%}
.ed-page svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ed-page.draw{cursor:crosshair}
.ed-page.place{cursor:copy}
.ed-page.text{cursor:text}
.ed-busy{position:absolute;top:10px;right:10px;font-size:12px;color:var(--muted)}

.cmp-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.cmp-col{position:relative;overflow:auto;background:var(--bg);padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;-webkit-overflow-scrolling:touch}
.cmp-col .cpg{position:relative;width:100%;max-width:900px;background:#fff;box-shadow:var(--shadow)}
.cmp-col .cpg canvas{width:100%;height:100%;display:block}
.cmp-col .cpg i{position:absolute;bottom:-20px;left:0;font-style:normal;font-size:11px;color:var(--muted)}
.cmp-col h5{margin:0;align-self:stretch;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-diff{flex:1;overflow:auto;padding:18px;background:var(--bg)}
.diffbox{max-width:980px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font:13.5px/1.75 var(--font);white-space:pre-wrap;word-break:break-word}
.diffbox del{background:#fde2e1;color:#b42318;text-decoration:line-through;text-decoration-color:rgba(180,35,24,.5)}
.diffbox ins{background:#dcfae6;color:#067647;text-decoration:none}
@media (prefers-color-scheme:dark){.diffbox del{background:#4a1d1b;color:#ffb4ab}.diffbox ins{background:#123d26;color:#86efac}}
.diffbox .pg{display:block;color:var(--muted);font-size:12px;font-weight:600;margin:10px 0 2px;border-top:1px dashed var(--line2);padding-top:8px}
.diffbox .fold{display:block;color:var(--muted);font-size:12px;background:var(--surface2);border-radius:6px;padding:2px 8px;margin:4px 0}
.diffsum{max-width:980px;margin:0 auto 12px;display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.diffsum span{padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}

/* ---------- modal / busy / toast ---------- */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(10,12,16,.45);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-l);animation:pop .18s}
.modal.wide{width:min(720px,100%)}
.modal header{padding:16px 18px 4px;font-weight:700;font-size:16px}
.modal .mb{padding:10px 18px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.busy{position:fixed;inset:0;z-index:120;background:rgba(10,12,16,.35);display:none;place-items:center}
.busy.on{display:grid}
.busy .box{width:min(340px,86vw);background:var(--surface);border-radius:14px;padding:18px;box-shadow:var(--shadow-l)}
.busy .msg{font-size:14px;margin-bottom:10px}
.busy .bar i{background:var(--accent);transition:width .15s}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:130;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1b1f27;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-l);max-width:min(560px,90vw);animation:pop .2s}
.toast.warn{background:#7a4a06}
.toast.err{background:#9b1c1c}
.sigpad{position:relative;border:1px solid var(--line2);border-radius:12px;background:#fff;height:230px;touch-action:none;overflow:hidden}

const FONT_SERIF = '"Songti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU","MingLiU","Source Han Serif TC",serif';
const LH = 1.3;

function mkCanvas(w, h) {

const _lib = {};
function loadScriptOnce(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.crossOrigin = 'anonymous';
    s.onload = res;
    s.onerror = () => { s.remove(); rej(new Error('load failed: ' + src)); };
    document.head.appendChild(s);
  });
}
/** 依序嘗試各 CDN，直到 globalName 出現 */
async function loadScript(path, globalName) {
  for (const host of CDN_HOSTS) {
    try {
      await loadScriptOnce(host + path);
      if (!globalName || window[globalName]) return;
    } catch (e) { console.warn(e.message); }
  }
  throw new Error('無法載入函式庫，請確認網路連線後重試');
}
function lazy(key, fn) {
  return _lib[key] ||= fn().catch(e => { delete _lib[key]; throw e; });
}
const getPdfjs = () => lazy('pdfjs', async () => {
  let lastErr;
  for (const host of CDN_HOSTS) {
    const base = host + PKG.pdfjs;
    try {
      const m = await import(base + 'legacy/build/pdf.min.mjs');
      m.GlobalWorkerOptions.workerSrc = base + 'legacy/build/pdf.worker.min.mjs';
      PDFJS_BASE = base;
      return m;
    } catch (e) { lastErr = e; console.warn('pdf.js 載入失敗，改試下一個 CDN', host, e); }
  }
  throw new Error('無法載入 pdf.js，請確認網路連線後重試' + (lastErr ? `（${lastErr.message}）` : ''));
});
const getPdfLib = () => lazy('pdflib', async () => {
  if (!window.PDFLib) await loadScript(PKG.pdflib, 'PDFLib');
  return window.PDFLib;
});
const getJSZip = () => lazy('jszip', async () => {
  if (!window.JSZip) await loadScript(PKG.jszip, 'JSZip');

const getDiff = () => lazy('diff', async () => {

function pdfjsOpen(pdfjs, bytes, name) {
  const task = pdfjs.getDocument({
    data: bytes.slice(), // pdf.js 會轉移 buffer，給它一份複本
    cMapUrl: PDFJS_BASE + 'cmaps/',
    cMapPacked: true,
    standardFontDataUrl: PDFJS_BASE + 'standard_fonts/',
    isEvalSupported: false,
    enableXfa: false,
  });
  task.onPassword = (update, reason) => {
    const pw = prompt((reason === 2 ? '密碼錯誤，請重新輸入' : `「${name}」受密碼保護，請輸入開啟密碼`) + '：');
    if (pw === null) task.destroy(); else update(pw);

}

/* ---------------- 幾何：座標系統 ----------------
   B 空間：PDF 使用者空間，以頁面可視框左下角為原點（y 向上，單位 pt）
   D_R 空間：頁面依總旋轉 R 顯示時的畫面座標（左上原點、y 向下，單位 pt）
   P(R)：D_R → B
   每個標註記錄建立時的 frame（= 當時的 R），因此之後再旋轉頁面，
   標註會跟著內容一起轉，與一般 PDF 閱讀器的行為一致。              */
const Mx = {
  mul: (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]],
  inv: m => { const d = m[0] * m[3] - m[1] * m[2]; return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d]; },
  ap: (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]],
};
function P(R, W, H) {
  switch (R) {
    case 90: return [0, 1, 1, 0, 0, 0];
    case 180: return [-1, 0, 0, 1, W, 0];
    case 270: return [0, -1, -1, 0, W, H];
    default: return [1, 0, 0, -1, 0, H];
  }
}
const norm = r => ((r % 360) + 360) % 360;
function geo(it) {
  const s = S.sources.get(it.src), g = s.pages[it.idx];
  const R = norm(g.rot + it.rot), sw = R % 180 === 0;
  return { ...g, W: g.W, H: g.H, vx: g.vx, vy: g.vy, base: g.rot, R, dw: sw ? g.W : g.H, dh: sw ? g.H : g.W };
}
function rectMap(m, x, y, w, h) {
  const pts = [Mx.ap(m, x, y), Mx.ap(m, x + w, y), Mx.ap(m, x, y + h), Mx.ap(m, x + w, y + h)];
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  return { x: x0, y: y0, w: Math.max(...xs) - x0, h: Math.max(...ys) - y0 };
}
const bToD = (r, g) => rectMap(Mx.inv(P(g.R, g.W, g.H)), r.x, r.y, r.w, r.h);
const dToB = (r, g) => rectMap(P(g.R, g.W, g.H), r.x, r.y, r.w, r.h);

function visibleD(it, g) { const b = cropB(it, g); return b ? bToD(b, g) : { x: 0, y: 0, w: g.dw, h: g.dh }; }

/* ---------------- 復原／重做 ---------------- */
const HIST_MAX = 30;
const HIST = { stack: [], idx: -1 };
/**
 * 快照只保存「頁面順序 + 每頁的 JSON 字串」。
 * 沒有變動的頁面會直接沿用上一個快照中的同一個字串（共用參照），
 * 因此每一步只會為「有變動的頁面」新增記憶體。
 */
function commit() {
  const prev = HIST.stack[HIST.idx];
  const map = new Map();
  for (const p of S.pages) {
    const json = JSON.stringify(p);
    const old = prev && prev.map.get(p.id);
    map.set(p.id, old === json ? old : json);
  }
  HIST.stack = HIST.stack.slice(0, HIST.idx + 1);
  HIST.stack.push({ order: S.pages.map(p => p.id), map });
  if (HIST.stack.length > HIST_MAX) HIST.stack.shift();
  HIST.idx = HIST.stack.length - 1;
  updateUndoBtns();
}
function restore(snap) {
  S.pages = snap.order.map(id => JSON.parse(snap.map.get(id)));
  S.sel = new Set([...S.sel].filter(id => snap.map.has(id)));
  renderAll();
  if (ED.open) edRefresh();
}
function undo() {
  if (HIST.idx <= 0) return;
  HIST.idx--;
  restore(HIST.stack[HIST.idx]);
  updateUndoBtns();
}
function redo() {
  if (HIST.idx >= HIST.stack.length - 1) return;
  HIST.idx++;
  restore(HIST.stack[HIST.idx]);
  updateUndoBtns();
}
function resetHistory() {
  HIST.stack = [];
  HIST.idx = -1;
  commit();
}
/** 資源（圖片、簽名）是否仍被目前頁面或任何復原紀錄使用 */
function assetInUse(assetId) {
  if (S.wm.asset === assetId) return true;
  if (S.pages.some(p => p.annots.some(a => a.asset === assetId))) return true;
  return HIST.stack.some(h => [...h.map.values()].some(j => j.includes(assetId)));
}
/** 釋放資源：撤銷 object URL 並從 S.assets 移除 */
function releaseAsset(assetId) {
  const a = S.assets.get(assetId);
  if (!a) return;
  if (a.url) URL.revokeObjectURL(a.url);
  S.assets.delete(assetId);
}
function updateUndoBtns() {
  const u = HIST.idx > 0, r = HIST.idx < HIST.stack.length - 1;
  ['#btnUndo', '#edUndo'].forEach(s => { const b = $(s); if (b) b.disabled = !u; });
  ['#btnRedo', '#edRedo'].forEach(s => { const b = $(s); if (b) b.disabled = !r; });
}

let _busyDepth = 0;

function toast(msg, type = '', ms = 3200) {

  $('#toasts').appendChild(t); setTimeout(() => t.remove(), ms);

function modal({ title, body, ok = '確定', cancel = '取消', wide = false, onOpen, onOk, danger = false }) {
  return new Promise(resolve => {
    const back = document.createElement('div'); back.className = 'modal-back';
    back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><header>${esc(title)}</header><div class="mb">${body}</div>
      <footer>${cancel ? `<button class="btn" data-m="cancel">${esc(cancel)}</button>` : ''}${ok ? `<button class="btn ${danger ? 'danger' : 'primary'}" data-m="ok">${esc(ok)}</button>` : ''}</footer></div>`;
    document.body.appendChild(back);
    const root = back.querySelector('.modal');
    const close = v => { back.remove(); document.removeEventListener('keydown', key, true); resolve(v); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } };
    document.addEventListener('keydown', key, true);
    back.addEventListener('click', async e => {
      const m = e.target.closest('[data-m]')?.dataset.m;
      if (e.target === back || m === 'cancel') close(null);
      else if (m === 'ok') { const v = onOk ? await onOk(root) : root; if (v !== false) close(v); }
    });
    onOpen && onOpen(root, close);
    setTimeout(() => root.querySelector('input:not([type=hidden]),textarea')?.focus(), 50);
  });
}

/* ---------------- 載入檔案 ---------------- */
async function addFiles(files) {
  files = [...files]; if (!files.length) return;
  const pr = busy('讀取檔案中…'); let added = 0;
  try {
    await getPdfjs().catch(e => { if (files.some(f => /pdf/i.test(f.type) || /\.pdf$/i.test(f.name))) throw e; });
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      pr.set(i / files.length, `讀取 ${f.name}`);
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      const isImg = /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|heic|heif|bmp|avif)$/i.test(f.name);
      try {
        if (isPdf) added += await addPdf(f, p => pr.set((i + p) / files.length));
        else if (isImg) added += await addImage(f);
        else toast(`不支援的檔案格式：${f.name}`, 'warn');
      } catch (e) { console.error(e); toast(`無法開啟「${f.name}」：${e.message || e}`, 'err', 5000); }
    }
  } catch (e) { toast(e.message || String(e), 'err', 5000); }
  finally { pr.done(); }
  if (added) { commit(); renderAll(); toast(`已加入 ${added} 頁`); }
}
async function addPdf(file, onProg) {
  const pdfjs = await getPdfjs();
  const bytes = new Uint8Array(await file.arrayBuffer());
  const doc = await pdfjsOpen(pdfjs, bytes, file.name);
  const src = { id: uid('s'), type: 'pdf', name: file.name, size: file.size, bytes, doc, num: doc.numPages, pages: [], color: nextColor(), hasForm: false };
  for (let i = 1; i <= doc.numPages; i++) {
    const p = await doc.getPage(i); const v = p.view;
    src.pages.push({ W: v[2] - v[0], H: v[3] - v[1], vx: v[0], vy: v[1], rot: norm(p.rotate) });
    if (i % 25 === 0) { onProg && onProg(i / doc.numPages); await tick(); }
  }
  try { const f = await doc.getFieldObjects(); src.hasForm = !!(f && Object.keys(f).length); } catch { }
  S.sources.set(src.id, src);
  for (let i = 0; i < doc.numPages; i++) S.pages.push(newItem(src.id, i));
  return doc.numPages;
}
async function makeAsset(blob, extra = {}) {
  const bytes = await blobBytes(blob);
  const mime = sniffMime(bytes) || blob.type || 'image/png';
  const img = await decodeImage(new Blob([bytes], { type: mime }));
  const w = img.naturalWidth, h = img.naturalHeight;
  // 預覽用縮小版（降低 iPad 記憶體壓力）
  const k = Math.min(1, 1600 / Math.max(w, h));
  const c = mkCanvas(w * k, h * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); releaseImg(img);
  const alpha = /png|gif|webp/.test(mime);
  const preview = await canvasToBlob(c, alpha ? 'image/png' : 'image/jpeg', 0.85); freeCanvas(c);
  const a = { id: extra.id || uid('a'), bytes, mime, w, h, preview, url: URL.createObjectURL(preview), orient: mime === 'image/jpeg' ? exifOrientation(bytes) : 1, alpha, ...extra };
  S.assets.set(a.id, a); return a;
}
async function addImage(file) {
  const a = await makeAsset(file);
  const src = { id: uid('s'), type: 'image', name: file.name, size: file.size, asset: a.id, color: nextColor(), num: 1, pages: [imageGeom(a.w, a.h)] };
  S.sources.set(src.id, src); S.pages.push(newItem(src.id, 0)); return 1;
}
function imageGeom(w, h) {
  const c = S.img, m = c.margin * MM; let W, H;
  if (c.size === 'fit') { const k = 842 / Math.max(w, h); W = w * k + 2 * m; H = h * k + 2 * m; }
  else {
    const sz = { a4: [595.28, 841.89], letter: [612, 792], a5: [419.53, 595.28] }[c.size] || [595.28, 841.89];
    const land = c.orient === 'landscape' || (c.orient === 'auto' && w > h);
    [W, H] = land ? [sz[1], sz[0]] : sz;
  }
  const k = Math.min((W - 2 * m) / w, (H - 2 * m) / h), dw = w * k, dh = h * k;
  return { W, H, vx: 0, vy: 0, rot: 0, ix: (W - dw) / 2, iy: (H - dh) / 2, iw: dw, ih: dh, img: true };

  renderGrid();
}

  if (!s) { s = { id: 'blank', type: 'blank', name: '空白頁', size: 0, num: 1, color: '#9aa3b5', pages: [{ W: 595.28, H: 841.89, vx: 0, vy: 0, rot: 0 }] }; S.sources.set('blank', s); }

}

  const s = S.sources.get(id);
  if (!s) return;
  S.pages = S.pages.filter(p => p.src !== id);
  S.sel = new Set([...S.sel].filter(pid => pageById(pid)));
  if (s.doc) s.doc.destroy();
  s.bytes = null;
  S.sources.delete(id);
  thumbCache.deleteWhere(k => k.startsWith(id + '|'));
  resetHistory(); // 先清掉復原紀錄，資源才不會再被引用
  if (s.asset && !assetInUse(s.asset)) releaseAsset(s.asset);
  if (typeof PV !== 'undefined') PV.key = null;

/* ---------------- 頁面渲染 ---------------- */
/** 以總旋轉 R 渲染頁面（R=0 代表 PDF 使用者空間原始方向），回傳新 canvas */
async function renderItem(it, scale, R = geo(it).R, opts = {}) {
  const s = S.sources.get(it.src), g = s.pages[it.idx];
  if (s.type === 'pdf') {
    const page = await s.doc.getPage(it.idx + 1);
    let vp = page.getViewport({ scale, rotation: R });
    const k = capScale(vp.width, vp.height);
    if (k < 1) vp = page.getViewport({ scale: scale * k, rotation: R });
    const c = mkCanvas(Math.ceil(vp.width), Math.ceil(vp.height));
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    const task = page.render({ canvasContext: ctx, viewport: vp, intent: opts.print ? 'print' : 'display' });
    if (opts.onTask) opts.onTask(task);
    await task.promise;
    return c;
  }
  const sw = R % 180 === 0, dw = sw ? g.W : g.H, dh = sw ? g.H : g.W;
  let k = scale * capScale(dw * scale, dh * scale);
  const c = mkCanvas(dw * k, dh * k), ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  if (s.type === 'image') {
    const a = S.assets.get(s.asset);
    const big = k * g.iw > 1500 && opts.full;
    const img = await decodeImage(big ? new Blob([a.bytes], { type: a.mime }) : a.preview);
    ctx.translate(c.width / 2, c.height / 2); ctx.rotate(R * Math.PI / 180); ctx.scale(k, k); ctx.translate(-g.W / 2, -g.H / 2);
    ctx.drawImage(img, g.ix, g.H - g.iy - g.ih, g.iw, g.ih); releaseImg(img);
  }
  return c;
}

/* ---------------- 縮圖（延遲渲染 + 佇列 + LRU 快取） ---------------- */
const THUMB_MAX = 80;

const thumbCache = {
  m: new Map(),
  has(k) { return this.m.has(k); },
  get(k) {
    const v = this.m.get(k);
    if (v !== undefined) { this.m.delete(k); this.m.set(k, v); } // 移到最新
    return v;
  },
  set(k, v) {
    this.delete(k);
    this.m.set(k, v);
    this.evict();
  },
  delete(k) {
    const v = this.m.get(k);
    if (v === undefined) return;
    URL.revokeObjectURL(v);
    this.m.delete(k);
  },
  deleteWhere(fn) {
    for (const k of [...this.m.keys()]) if (fn(k)) this.delete(k);
  },
  evict() {
    if (this.m.size <= THUMB_MAX) return;
    const inUse = new Set($$('.card').filter(el => el._vis).map(el => el._key));
    for (const k of [...this.m.keys()]) { // Map 依插入順序，最前面就是最久未使用
      if (this.m.size <= THUMB_MAX) break;
      if (!inUse.has(k)) this.delete(k);
    }
  },
  get size() { return this.m.size; },

/* ---------------- 頁面操作 ---------------- */

/* ---------------- 格狀檢視互動：點選、拖曳排序（滑鼠 + 觸控長按） ---------------- */
let DRAG = null;
function initGridInteractions() {
  const grid = $('#grid'), ws = $('#workspace');
  grid.addEventListener('pointerdown', e => {
    const card = e.target.closest('.card');
    if (!card || e.target.closest('.card-acts') || e.button > 0) return;
    if (e.pointerType === 'mouse') e.preventDefault();
    const st = {
      card, id: card.dataset.id, x: e.clientX, y: e.clientY, pid: e.pointerId, type: e.pointerType,
      active: false, moved: false, shift: e.shiftKey, meta: e.metaKey || e.ctrlKey,

    // 觸控／觸控筆：長按 380ms 才進入拖曳，避免與捲動衝突
    if (e.pointerType !== 'mouse') {
      st.timer = setTimeout(() => {
        if (DRAG === st && !st.moved) { startDrag(st, st.x, st.y); navigator.vibrate?.(12); }
      }, 380);
    }
  });
  window.addEventListener('pointermove', e => {
    if (!DRAG || e.pointerId !== DRAG.pid) return;
    if (!DRAG.active) {
      if (Math.hypot(e.clientX - DRAG.x, e.clientY - DRAG.y) > 8) {
        DRAG.moved = true;
        if (DRAG.type === 'mouse') startDrag(DRAG, e.clientX, e.clientY);
        else { clearTimeout(DRAG.timer); DRAG = null; }
      }

    }
    DRAG.lx = e.clientX; DRAG.ly = e.clientY; moveDrag();
  });

    if (!DRAG || e.pointerId !== DRAG.pid) return;
    const d = DRAG; DRAG = null; clearTimeout(d.timer);
    if (d.active) endDrag(d, e.type === 'pointercancel');
    else if (!d.moved && e.type === 'pointerup') tapCard(d);
  };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  grid.addEventListener('touchmove', e => { if (DRAG && DRAG.active) e.preventDefault(); }, { passive: false });
  grid.addEventListener('contextmenu', e => { if (e.target.closest('.card')) e.preventDefault(); });
  grid.addEventListener('dblclick', e => { const c = e.target.closest('.card'); if (c && !e.target.closest('.card-acts')) openEditor(c.dataset.id); });
  grid.addEventListener('click', e => {
    const b = e.target.closest('.card-acts button'); if (!b) return;
    const it = pageById(b.closest('.card').dataset.id); if (!it) return;
    if (b.dataset.act === 'rotr') rotatePages([it], 90);
    else if (b.dataset.act === 'edit') openEditor(it.id);
    else if (b.dataset.act === 'del') deletePages([it]);
  });

    st.active = true; st.lx = x; st.ly = y;
    st.ids = S.sel.has(st.id) ? S.pages.filter(p => S.sel.has(p.id)).map(p => p.id) : [st.id];
    st.ids.forEach(id => $(`.card[data-id="${id}"]`)?.classList.add('dragging'));
    const g = document.createElement('div'); g.className = 'drag-ghost';
    const src = st.card.querySelector('img').getAttribute('src');
    g.innerHTML = (src ? `<img src="${src}">` : `<div style="height:110px"></div>`) + (st.ids.length > 1 ? `<b>${st.ids.length}</b>` : '');
    document.body.appendChild(g); st.ghost = g;
    st.ind = document.createElement('div'); st.ind.className = 'drop-ind'; st.ind.hidden = true; document.body.appendChild(st.ind);
    const loop = () => { if (!st.active) return; autoScroll(st); st.raf = requestAnimationFrame(loop); };
    st.raf = requestAnimationFrame(loop);

  }
  function autoScroll(st) {
    const r = ws.getBoundingClientRect(), edge = 70;

  }

    const st = DRAG; if (!st || !st.active) return;

    const el = document.elementFromPoint(st.lx, st.ly)?.closest('.card');
    if (!el) { st.target = null; st.ind.hidden = true; return; }
    const r = el.getBoundingClientRect(), before = st.lx < r.left + r.width / 2;
    st.target = { id: el.dataset.id, before };
    Object.assign(st.ind.style, { left: (before ? r.left - 11 : r.right + 7) + 'px', top: r.top + 'px', height: r.height + 'px' });
    st.ind.hidden = false;
  }
  function endDrag(st, cancel) {
    st.active = false; cancelAnimationFrame(st.raf);
    st.ghost.remove(); st.ind.remove();
    $$('.card.dragging').forEach(c => c.classList.remove('dragging'));
    if (cancel || !st.target || st.ids.includes(st.target.id)) return;
    const ids = new Set(st.ids), moving = S.pages.filter(p => ids.has(p.id)), rest = S.pages.filter(p => !ids.has(p.id));

  }

    const ids = S.pages.map(p => p.id);
    if (d.shift && S.anchor && ids.includes(S.anchor)) {
      const [a, b] = [ids.indexOf(S.anchor), ids.indexOf(d.id)].sort((x, y) => x - y);
      ids.slice(a, b + 1).forEach(i => S.sel.add(i));
    } else if (S.sel.has(d.id)) S.sel.delete(d.id); else S.sel.add(d.id);
    S.anchor = d.id; refreshSelection();
  }
}

/* =====================================================================

   - 一般頁：copyPages（保留原始文字層、字型、向量）

    if (d.isEncrypted) d = null;
  } catch (e) { console.warn(e); d = null; }
  if (!d && !src._warned) { src._warned = true; toast(`「${src.name}」為加密或結構特殊的檔案，該檔頁面將以高解析影像輸出`, 'warn', 6000); }

  bmp.close && bmp.close();
  const bytes = await blobBytes(await canvasToBlob(c, 'image/jpeg', q));
  freeCanvas(c);
  if (bytes.length >= o.contents.length * 0.92) return null;

  const nd = d.clone(ctx);
  nd.set(N('Width'), L.PDFNumber.of(tw));
  nd.set(N('Height'), L.PDFNumber.of(th));
  nd.set(N('BitsPerComponent'), L.PDFNumber.of(8));
  nd.set(N('Filter'), N('DCTDecode'));
  // Canvas 輸出一律為 sRGB JPEG，必須同步改為 DeviceRGB，否則保留 ICCBased / CMYK 會偏色
  nd.set(N('ColorSpace'), N('DeviceRGB'));

  nd.delete(N('Decode'));

}
async function compressDoc(doc, cfg, prog = () => { }) {
  const L = await getPdfLib(), N = s => L.PDFName.of(s), ctx = doc.context;
  let maxIn = 1;
  for (const p of doc.getPages()) {
    const { width, height } = p.getSize();
    maxIn = Math.max(maxIn, width / 72, height / 72);
  }
  const maxDim = Math.max(300, Math.round(maxIn * cfg.dpi));
  const objs = ctx.enumerateIndirectObjects();
  const isImg = o => o instanceof L.PDFRawStream && o.dict.get(N('Subtype')) === N('Image');
  // SMask / Mask 是其他圖片的遮罩，不可轉成 RGB JPEG
  const masks = new Set();
  for (const [, o] of objs) {
    if (!isImg(o)) continue;
    for (const k of ['SMask', 'Mask']) {
      const v = o.dict.get(N(k));
      if (v instanceof L.PDFRef) masks.add(v.toString());
    }
  }
  const imgs = objs.filter(([r, o]) => isImg(o) && !masks.has(r.toString()));
  const st = { images: imgs.length, recompressed: 0, imgBefore: 0, imgAfter: 0, streams: 0 };
  for (let i = 0; i < imgs.length; i++) {
    const [ref, o] = imgs[i];
    prog(i / Math.max(1, imgs.length) * 0.9, `最佳化內嵌圖片 ${i + 1} / ${imgs.length}`);
    try {
      const r = await recompressImage(L, ctx, o, maxDim, cfg.q);
      if (r) {
        ctx.assign(ref, r);
        st.recompressed++;
        st.imgBefore += o.contents.length;
        st.imgAfter += r.contents.length;
      }
    } catch (e) { console.warn('略過圖片', e); }
    if (i % 2 === 1) await tick();
  }
  if (cfg.deflate !== false && typeof CompressionStream !== 'undefined') {
    prog(0.92, '壓縮未壓縮的內容串流…');
    for (const [ref, o] of objs) {
      if (!(o instanceof L.PDFRawStream) || ctx.lookup(ref) !== o) continue;
      if (o.dict.has(N('Filter')) || o.contents.length < 400) continue;
      const t = o.dict.get(N('Type'));
      if (t === N('Metadata') || t === N('XRef') || t === N('ObjStm')) continue;
      try {
        const z = await deflate(o.contents);
        if (z.length < o.contents.length * 0.9) {
          o.dict.set(N('Filter'), N('FlateDecode'));
          ctx.assign(ref, L.PDFRawStream.of(o.dict, z));
          st.streams++;
        }
      } catch { }
    }
  }
  if (cfg.stripMeta) stripMeta(doc, L);
  prog(1);
  return st;
}
function pristineSource() {
  if (S.sources.size !== 1) return null;
  const s = [...S.sources.values()][0];
  if (s.type !== 'pdf' || S.pages.length !== s.num) return null;
  return S.pages.every((p, i) => p.src === s.id && p.idx === i && !p.rot && !p.crop && !p.annots.length && !p.redacts.length) ? s : null;
}

async function runSplit() {
  const b = baseName(), m = S.split.mode, n = S.pages.length, pad = i => String(i).padStart(String(n).length, '0');
  let groups = [];
  if (m === 'selected') { if (!needSel()) return; groups = [{ items: selectedPages(), name: `${b}_擷取.pdf` }]; }
  else if (m === 'each') groups = S.pages.map((p, i) => ({ items: [p], name: `${b}_p${pad(i + 1)}.pdf` }));
  else if (m === 'ranges') {
    for (const part of String(S.split.ranges).split(/[,，;；\s]+/).filter(Boolean)) {
      const mm = part.match(/^(\d+)(?:\s*[-–~～]\s*(\d*))?$/);
      if (!mm) return toast(`無法解析範圍「${part}」`, 'warn');
      const a = +mm[1], z = mm[2] === undefined ? a : mm[2] === '' ? n : +mm[2];
      if (a < 1 || z > n || a > z) return toast(`範圍「${part}」超出 1–${n}`, 'warn');
      groups.push({ items: S.pages.slice(a - 1, z), name: `${b}_p${a}${z > a ? '-' + z : ''}.pdf` });
    }
    if (!groups.length) return toast('請輸入頁碼範圍', 'warn');
  } else {
    const k = Math.max(1, Math.floor(S.split.every || 1));
    for (let i = 0; i < n; i += k) groups.push({ items: S.pages.slice(i, i + k), name: `${b}_p${i + 1}-${Math.min(n, i + k)}.pdf` });
  }
  const pr = busy('拆分中…'), cache = new Map(), files = [];
  try {
    for (let i = 0; i < groups.length; i++) {
      const g = groups[i];
      files.push({ name: g.name, data: await buildPdf(g.items, { ...effectOpts(), libCache: cache }, p => pr.set((i + p) / groups.length, `產生檔案 ${i + 1} / ${groups.length}`)) });
    }
    if (files.length === 1) saveBlob(new Blob([files[0].data], { type: 'application/pdf' }), files[0].name);
    else { pr.set(1, '打包 ZIP…'); await zipAndSave(files, `${b}_split.zip`); }
    toast(`完成，共 ${files.length} 個檔案`);
  } catch (e) { console.error(e); toast('拆分失敗：' + (e.message || e), 'err', 6000); }
  finally { cache.clear(); pr.done(); }
}
async function autoCrop(list, padPt) {
  if (!list.length) return;
  const pr = busy('偵測白邊…'); let n = 0;
  try {
    for (let i = 0; i < list.length; i++) {
      const it = list[i], g = geo(it), c = await renderItem(it, 800 / Math.max(g.W, g.H), 0);
      const { width: w, height: h } = c, d = c.getContext('2d').getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const k = (y * w + x) * 4; if (d[k] < 238 || d[k + 1] < 238 || d[k + 2] < 238) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      freeCanvas(c);
      if (x1 > x0 && y1 > y0) {
        const px = padPt / g.W, py = padPt / g.H;
        it.crop = { x0: clamp(x0 / w - px, 0, 1), x1: clamp((x1 + 1) / w + px, 0, 1), y0: clamp(1 - (y1 + 1) / h - py, 0, 1), y1: clamp(1 - y0 / h + py, 0, 1) };
        n++;
      }
      pr.set((i + 1) / list.length, `偵測白邊 ${i + 1} / ${list.length}`);
    }
  } finally { pr.done(); }
  commit(); renderGrid(); if (ED.open) edRefresh(); toast(`已裁剪 ${n} 頁`);
}
async function runToImg() {
  const cfg = S.toimg, items = scopePages(cfg.scope);
  if (!items.length) return;
  const type = cfg.fmt === 'png' ? 'image/png' : 'image/jpeg', ext = cfg.fmt === 'png' ? 'png' : 'jpg', b = baseName();
  const pad = i => String(i).padStart(String(items.length).length, '0');
  const pr = busy('轉換圖片中…'), files = [];
  const eff = effectOpts();
  const needBuild = cfg.edits && (eff.wm || eff.pn || items.some(p => p.annots.length || p.redacts.length || p.crop));
  try {
    if (needBuild) {
      const bytes = await buildPdf(items, eff, p => pr.set(p * 0.3, '套用編輯效果…'));
      const doc = await pdfjsOpen(await getPdfjs(), bytes, 'tmp');
      for (let i = 0; i < doc.numPages; i++) {
        const page = await doc.getPage(i + 1);
        let vp = page.getViewport({ scale: cfg.dpi / 72 }); const k = capScale(vp.width, vp.height); if (k < 1) vp = page.getViewport({ scale: cfg.dpi / 72 * k });
        const c = mkCanvas(vp.width, vp.height), x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        await page.render({ canvasContext: x, viewport: vp, intent: 'print' }).promise;
        files.push({ name: `${b}_p${pad(i + 1)}.${ext}`, data: await canvasToBlob(c, type, cfg.q) }); freeCanvas(c); page.cleanup();
        pr.set(0.3 + 0.65 * (i + 1) / doc.numPages, `轉換第 ${i + 1} / ${doc.numPages} 頁`);
      }

  const q = S.rdx.query.trim(); if (!q) return toast('請輸入搜尋文字', 'warn');
  let re;
  try { re = S.rdx.regex ? new RegExp(q, 'g') : new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); }
  catch { return toast('正規表示式格式錯誤', 'err'); }
  const list = scopePages(S.rdx.scope).filter(p => S.sources.get(p.src).type === 'pdf');
  const pr = busy('搜尋中…'); let hits = 0, pagesHit = 0;
  try {
    for (let i = 0; i < list.length; i++) {
      const it = list[i], s = S.sources.get(it.src), g = s.pages[it.idx];
      const page = await s.doc.getPage(it.idx + 1), tc = await page.getTextContent();
      let full = ''; const map = [];
      tc.items.forEach((t, ti) => { if (typeof t.str !== 'string') return; for (let c = 0; c < t.str.length; c++) map.push([ti, c]); full += t.str; });

      pr.set((i + 1) / list.length, `搜尋第 ${i + 1} / ${list.length} 頁`);
    }
  } catch (e) { console.error(e); toast('搜尋失敗：' + e.message, 'err'); }
  finally { pr.done(); }

  if (box) box.innerHTML = hits ? `<p class="note ok">在 ${pagesHit} 頁找到並標記了 ${hits} 處。請在縮圖或編輯器中確認位置。</p>` : `<p class="note">找不到符合的文字（掃描影像型 PDF 沒有文字層，請改用手動框選）。</p>`;

}

function cmpSync(from, to) {

    saveBlob(new Blob([bytes], { type: 'application/pdf' }), s.name.replace(/\.pdf$/i, '') + (flatten ? '_已填寫_扁平化.pdf' : '_已填寫.pdf'));
    toast(flatten ? '已匯出扁平化表單' : cjk.length ? '已匯出（中文欄位由閱讀器顯示，若顯示異常請改用扁平化）' : '已匯出表單', '', 5000);
  } catch (e) { console.error(e); toast('表單匯出失敗：' + (e.message || e), 'err', 6000); }
  finally { pr.done(); }
}

/* =====================================================================
   初始化
   ===================================================================== */
function buildNav() {
  let h = '', g = '';
  for (const t of TOOLS) {
    if (t.g !== g) { g = t.g; h += `<h6>${g}</h6>`; }
    h += `<button class="tbtn" data-tool="${t.id}">${ICON(t.icon)}<span>${t.name}</span></button>`;
  }
  $('#toolnav').innerHTML = h;
  // 空白畫面的 15 項功能捷徑
  const CHIPS = [
    ['合併', 'organize'], ['拆分', 'split'], ['排列', 'organize'], ['旋轉', 'rotate'], ['裁剪', 'crop'],
    ['PDF 轉 JPG', 'toimg'], ['JPG 轉 PDF', 'fromimg'], ['壓縮', 'compress'], ['浮水印', 'watermark'], ['頁碼', 'pagenum'],
    ['簽名', 'sign'], ['編輯', 'edit'], ['密文', 'redact'], ['比較', 'compare'], ['表單', 'form'],
  ];
  $('#chips').innerHTML = CHIPS.map(([n, t]) => `<button data-tool="${t}">${n}</button>`).join('');
  const onTool = e => { const b = e.target.closest('[data-tool]'); if (b) setTool(b.dataset.tool); };
  $('#toolnav').addEventListener('click', onTool);
  $('#chips').addEventListener('click', onTool);
}
function init() {
  document.body.classList.toggle('touch', IS_TOUCH);
  loadSettings(); buildNav(); initGridInteractions(); initEditor(); initCompare();
  $('#btnAdd').onclick = $('#btnAdd2').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  $('#btnExport').onclick = openExportDialog;
  $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
  $('#panel').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && ACTIONS[b.dataset.a]) ACTIONS[b.dataset.a](b, e); });
  $('#wsBar').addEventListener('click', e => {
    const a = e.target.closest('[data-ws]')?.dataset.ws;
    ({ all: ACTIONS.selAll, none: ACTIONS.selNone, rotl: ACTIONS.rotl, rotr: ACTIONS.rotr, del: ACTIONS.del, edit: () => openEditor(null) })[a]?.();
  });
  $('#thumbSize').addEventListener('input', e => document.documentElement.style.setProperty('--thumb-w', e.target.value + 'px'));
  // 拖放檔案
  let depth = 0; const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  window.addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; document.body.classList.add('dragover'); } });
  window.addEventListener('dragleave', e => { if (hasFiles(e) && --depth <= 0) { depth = 0; document.body.classList.remove('dragover'); } });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (!hasFiles(e)) return; e.preventDefault(); depth = 0; document.body.classList.remove('dragover');
    const f = e.dataTransfer.files; if (!$('#compare').hidden) cmpAddFiles(f); else addFiles(f);
  });
  window.addEventListener('paste', e => {
    if (e.target.closest?.('input,textarea')) return;
    const f = [...(e.clipboardData?.files || [])]; if (f.length) { e.preventDefault(); addFiles(f); }
  });
  document.addEventListener('keydown', e => {
    if (document.querySelector('.modal-back') || e.target.closest('input,textarea,select,[contenteditable]')) return;
    const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); redo(); return; }
    if (ED.open) {
      if (e.key === 'Escape') { if (ED.sel) { ED.sel = null; edDraw(); edProps(); } else closeEditor(); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && ED.sel) { e.preventDefault(); edDeleteSel(); }
      else if (e.key === 'PageDown' || (e.key === 'ArrowRight' && !ED.sel)) edGo(1);
      else if (e.key === 'PageUp' || (e.key === 'ArrowLeft' && !ED.sel)) edGo(-1);
      return;
    }
    if (!$('#compare').hidden) { if (e.key === 'Escape') closeCompare(); return; }
    if (mod && k === 'a') { e.preventDefault(); ACTIONS.selAll(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel.size) { e.preventDefault(); deletePages(selectedPages()); }
    else if (e.key === 'Escape' && S.sel.size) ACTIONS.selNone();
  });
  window.addEventListener('beforeunload', e => { if (S.pages.length) { e.preventDefault(); e.returnValue = ''; } });
  renderAll(); resetHistory(); loadSigs();
  // 閒置時預先載入函式庫，讓第一次開檔更快
  const idle = window.requestIdleCallback || (f => setTimeout(f, 1200));
  idle(() => getPdfjs().then(() => idle(() => getPdfLib().catch(() => { }))).catch(() => { }));
}
init();
</script>
